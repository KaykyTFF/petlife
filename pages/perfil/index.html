<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Perfil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { initProfile } from '/src/js/pages/perfil.js';

    // 1. Render Layout
    renderAppLayout({
      title: 'Perfil',
      content: '<div id="profile-content"></div>'
    });

    // 2. Initialize Profile Logic
    document.addEventListener('DOMContentLoaded', () => {
      initProfile();
    });
  </script>
</body>
</html>
