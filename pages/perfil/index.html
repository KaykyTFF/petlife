<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Perfil</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { withLoading, SkeletonProfile } from '/src/components/skeleton.js';

    const renderContent = () => `
        <div class="max-w-4xl mx-auto">
          <div class="page-header">
            <div>
              <h1 class="page-title">Meu Perfil</h1>
              <p class="page-subtitle">Gerencie suas informações pessoais e dados da conta.</p>
            </div>
          </div>

          <!-- Profile Header -->
          <div class="card p-6 flex flex-col md:flex-row items-center gap-6 mb-8">
            <div class="w-24 h-24 rounded-full bg-[var(--color-primary)] text-white flex items-center justify-center text-3xl font-semibold flex-shrink-0">
              K
            </div>
            <div class="flex-1 text-center md:text-left">
              <h2 class="text-xl font-semibold text-[var(--color-text)]">Kayky</h2>
              <p class="text-sm text-[var(--color-text-muted)] mt-1">user@lifepet.com.br</p>
              <div class="mt-3 inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--color-primary)]/10 text-[var(--color-primary)]">
                Plano Premium
              </div>
            </div>
            <div class="mt-4 md:mt-0">
              <button class="btn-secondary">Editar Perfil</button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-8">
              <section class="card">
                <div class="card-header border-b border-[var(--color-input-border)] pb-4 mb-4">
                  <h3 class="card-title text-sm">Informações Pessoais</h3>
                </div>
                <div class="space-y-4">
                  <div>
                    <label class="form-label text-xs text-[var(--color-text-muted)]">Nome Completo</label>
                    <p class="text-sm font-medium text-[var(--color-text)] mt-1">Kayky</p>
                  </div>
                  <div>
                    <label class="form-label text-xs text-[var(--color-text-muted)]">Telefone</label>
                    <p class="text-sm font-medium text-[var(--color-text)] mt-1">(11) 99999-9999</p>
                  </div>
                  <div>
                    <label class="form-label text-xs text-[var(--color-text-muted)]">Localização</label>
                    <p class="text-sm font-medium text-[var(--color-text)] mt-1">São Paulo, SP</p>
                  </div>
                </div>
              </section>
            </div>

            <div class="space-y-8">
              <section class="card">
                <div class="card-header border-b border-[var(--color-input-border)] pb-4 mb-4">
                  <h3 class="card-title text-sm">Estatísticas</h3>
                </div>
                <div class="space-y-4">
                  <div class="flex justify-between items-center text-sm">
                    <span class="text-[var(--color-text-muted)]">Pets cadastrados</span>
                    <span class="font-semibold text-[var(--color-text)]">3</span>
                  </div>
                  <div class="flex justify-between items-center text-sm">
                    <span class="text-[var(--color-text-muted)]">Vacinas registradas</span>
                    <span class="font-semibold text-[var(--color-text)]">12</span>
                  </div>
                  <div class="flex justify-between items-center text-sm">
                    <span class="text-[var(--color-text-muted)]">Consultas realizadas</span>
                    <span class="font-semibold text-[var(--color-text)]">8</span>
                  </div>
                </div>
              </section>

              <section class="card border-red-100">
                <div class="card-header border-red-50 pb-4 mb-4">
                  <h3 class="card-title text-sm text-[var(--color-danger)]">Zona de Perigo</h3>
                </div>
                <p class="text-xs text-[var(--color-text-muted)] mb-4">
                  Ao excluir sua conta, todos os dados dos seus pets serão permanentemente removidos.
                </p>
                <button class="btn-danger w-full">Excluir Conta</button>
              </section>
            </div>
          </div>
        </div>
    `;

    renderAppLayout({
      title: 'Perfil',
      content: '<div id="profile-content"></div>'
    });

    withLoading('profile-content', SkeletonProfile, renderContent, 800);
  </script>
</body>
</html>
