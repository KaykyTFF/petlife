<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Detalhes do Pet</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { withLoading, SkeletonPetDetails } from '/src/components/skeleton.js';
    import { getPetDetailsHTML, initPetDetailsEvents } from '/src/js/pages/detalhes-pet.js';

    renderAppLayout({
      title: 'Prontuário',
      content: '<div id="pet-details-content"></div>'
    });

    withLoading('pet-details-content', SkeletonPetDetails, () => {
      const html = getPetDetailsHTML();
      // Use a microtask or small timeout to ensure DOM is updated before attaching events
      setTimeout(initPetDetailsEvents, 0);
      return html;
    }, 1000);
  </script>
</body>
</html>
