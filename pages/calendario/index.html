<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Calendário</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { initCalendar } from '/src/js/pages/calendario.js';

    // 1. Render main layout structure
    renderAppLayout({
      title: 'Calendário',
      content: `
        <div class="page-header">
          <div>
            <h1 class="page-title">Calendário</h1>
            <p class="page-subtitle">Acompanhe os próximos compromissos e agendamentos.</p>
          </div>
          <div class="flex items-center gap-2">
          </div>
        </div>

        <div id="calendar-content" class="min-h-[600px] w-full">
          <!-- Skeleton or Spinner can be injected here by the Component if needed -->
          <div class="animate-pulse flex flex-col items-center justify-center min-h-[600px] gap-4">
            <div class="w-12 h-12 bg-gray-200 rounded-full"></div>
            <div class="h-4 bg-gray-200 rounded w-48"></div>
          </div>
        </div>
      `
    });

    // 2. Initialize the dynamic calendar
    // The calendar component handles its own loading state internally
    initCalendar();
  </script>
</body>
</html>
