<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Meus Pets</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { SkeletonPets } from '/src/components/skeleton.js';
    import { initMeusPets } from '/src/js/pages/pets.js';

    // 1. Initial Layout
    renderAppLayout({
      title: 'Meus Pets',
      content: '<div id="pets-content"></div>'
    });

    // 2. Fetch and Render Logic
    async function initMeusPetsPage() {
      const container = document.getElementById("pets-content");
      if (!container) return;

      // Show Skeleton
      container.innerHTML = SkeletonPets();

      // Wait a moment for UX
      await new Promise(resolve => setTimeout(resolve, 800));

      // Call the actual initialization which fetches and renders inside the container
      await initMeusPets();
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMeusPetsPage();
    });
  </script>
</body>
</html>
