<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Cadastro</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>
  
  <script type="module">
    import { renderAuthLayout } from '/src/layouts/auth-layout.js';
    
    renderAuthLayout({
      title: 'CADASTRO',
      subtitle: 'Comece a cuidar melhor do seu pet agora mesmo.',
      panelClass: 'register-form-panel',
      content: `
        <form id="register-form" class="space-y-5 w-full">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group mb-0">
              <label class="form-label">Nome</label>
              <input type="text" id="first_name" placeholder="Seu nome" class="input-field" required>
            </div>
            <div class="form-group mb-0">
              <label class="form-label">Sobrenome</label>
              <input type="text" id="last_name" placeholder="Seu sobrenome" class="input-field" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" class="input-field" required>
            <div class="form-error-slot">
              <span id="email-error" class="form-error-message"></span>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group mb-0">
              <label class="form-label">Telefone (Opcional)</label>
              <input type="tel" id="phone" placeholder="(00) 00000-0000" class="input-field">
            </div>
            <div class="form-group mb-0">
              <label class="form-label">Data de Nascimento</label>
              <input type="date" id="data_nascimento" class="input-field">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="password-field">
              <input type="password" id="password" placeholder="Mínimo 8 caracteres" class="input-field" required>
              <button type="button" class="password-toggle" aria-label="Mostrar senha"></button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar Senha</label>
            <div class="password-field">
              <input type="password" id="password_confirm" placeholder="Repita sua senha" class="input-field" required>
              <button type="button" class="password-toggle" aria-label="Mostrar senha"></button>
            </div>
          </div>
          

          <div id="error-message" class="text-red-400 text-sm font-bold hidden"></div>

          <button type="submit" class="btn-primary w-full py-4 text-lg shadow-lg shadow-black/20 mt-2">
            CRIAR MINHA CONTA
          </button>
        </form>
        
        <div class="mt-12 text-center text-white/70 text-sm">
          Já tem uma conta? 
          <a href="/pages/login/index.html" class="font-black text-[var(--color-accent)] hover:text-white transition-all ml-1 cursor-pointer uppercase tracking-widest">Fazer Login</a>
        </div>
      `
    });
  </script>
  <script type="module" src="/src/js/pages/cadastro.js"></script>
</body>
</html>
