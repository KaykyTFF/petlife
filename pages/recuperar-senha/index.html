<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Recuperar Senha</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>
  
  <script type="module">
    import { renderAuthLayout } from '/src/layouts/auth-layout.js';
    
    renderAuthLayout({
      title: 'RECUPERAR ACESSO',
      subtitle: 'Esqueceu sua senha? Não se preocupe, vamos te ajudar a voltar.',
      content: `
        <form class="space-y-8 w-full">
          <div class="form-group">
            <label class="form-label">E-mail de recuperação</label>
            <input type="email" placeholder="seu@email.com" class="input-field" required>
          </div>
          <button type="button" class="btn-primary w-full py-4 text-lg shadow-lg shadow-black/20 mt-4">
            ENVIAR INSTRUÇÕES
          </button>
        </form>
        
        <div class="mt-12 text-center text-white/70 text-sm">
          Lembrou a senha? 
          <a href="/pages/login/index.html" class="font-black text-[var(--color-accent)] hover:text-white transition-all ml-1 cursor-pointer uppercase tracking-widest">Voltar para o Login</a>
        </div>
      `
    });
  </script>
</body>
</html>
