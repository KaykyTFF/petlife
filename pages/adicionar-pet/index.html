<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Adicionar Pet</title>
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { withLoading, SkeletonForm, SkeletonHeader } from '/src/components/skeleton.js';

    const renderContent = () => `
        <div class="max-w-2xl mx-auto">
          <div class="page-header">
            <div>
              <h1 class="page-title">Novo Pet</h1>
              <p class="page-subtitle">Preencha as informações básicas para iniciar o monitoramento.</p>
            </div>
          </div>

          <div class="card mt-6">
            <form class="space-y-6">
              <div class="flex flex-col mb-6">
                <label class="form-label mb-3">Foto do Pet</label>
                <div class="w-24 h-24 rounded-full border-2 border-dashed border-[var(--color-input-border)] flex items-center justify-center bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer relative group">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400 group-hover:text-[var(--color-primary)] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Nome Completo</label>
                  <input type="text" placeholder="Ex: Rex" class="input-field">
                </div>
                <div class="form-group">
                  <label class="form-label">Espécie</label>
                  <select class="input-field">
                    <option value="" disabled selected>Selecione a espécie</option>
                    <option value="dog">Cachorro</option>
                    <option value="cat">Gato</option>
                    <option value="bird">Pássaro</option>
                    <option value="other">Outro</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Raça</label>
                  <input type="text" placeholder="Ex: Golden Retriever" class="input-field">
                </div>
                <div class="form-group">
                  <label class="form-label">Data de Nascimento</label>
                  <input type="date" class="input-field">
                </div>
              </div>

              <div class="flex items-center justify-end gap-3 pt-6 border-t border-[var(--color-input-border)]">
                <button type="button" onclick="history.back()" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar Pet</button>
              </div>
            </form>
          </div>
        </div>
    `;

    renderAppLayout({
      title: 'Adicionar Pet',
      content: '<div id="add-pet-content"></div>'
    });

    withLoading('add-pet-content', () => `
      <div class="max-w-2xl mx-auto space-y-8">
        ${SkeletonHeader(false)}
        ${SkeletonForm()}
      </div>
    `, renderContent, 800);
  </script>
</body>
</html>
