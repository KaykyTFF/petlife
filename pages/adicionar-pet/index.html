<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePet - Adicionar Pet</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { renderAppLayout } from '/src/layouts/app-layout.js';
    import { withLoading, SkeletonForm, SkeletonHeader } from '/src/components/skeleton.js';
    import { initAdicionarPet } from '/src/js/pages/adicionar-pet.js';

    const renderContent = () => `
        <div class="max-w-2xl mx-auto">
          <div class="page-header">
            <div>
              <h1 class="page-title">Novo Pet</h1>
              <p class="page-subtitle">Preencha as informações básicas para iniciar o monitoramento.</p>
            </div>
          </div>

          <div class="card mt-6">
            <form class="space-y-6" novalidate>
              <div class="flex flex-col mb-6">
                <label class="form-label mb-3">Foto do Pet</label>
                <input type="file" id="pet-photo" class="hidden" accept="image/*">
                <div id="photo-upload-container" class="w-24 h-24 rounded-full border-2 border-dashed border-[var(--color-input-border)] flex items-center justify-center bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer relative group overflow-hidden">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400 group-hover:text-[var(--color-primary)] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Nome Completo</label>
                  <input type="text" id="pet-name" placeholder="Ex: Rex" class="input-field" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Espécie</label>
                  <select id="pet-species" class="input-field" required>
                    <option value="" disabled selected>Selecione a espécie</option>
                    <option value="Cachorro">Cachorro</option>
                    <option value="Gato">Gato</option>
                    <option value="Alpaca">Alpaca</option>
                    <option value="Aranha">Aranha</option>
                    <option value="Arara">Arara</option>
                    <option value="Cabra">Cabra</option>
                    <option value="Cacatua">Cacatua</option>
                    <option value="Calopsita">Calopsita</option>
                    <option value="Canário">Canário</option>
                    <option value="Cavalo">Cavalo</option>
                    <option value="Chinchila">Chinchila</option>
                    <option value="Cobra">Cobra</option>
                    <option value="Coelho">Coelho</option>
                    <option value="Coruja">Coruja</option>
                    <option value="Cágado">Cágado</option>
                    <option value="Escorpião">Escorpião</option>
                    <option value="Furão">Furão</option>
                    <option value="Galinha">Galinha</option>
                    <option value="Ganso">Ganso</option>
                    <option value="Gerbil">Gerbil</option>
                    <option value="Iguana">Iguana</option>
                    <option value="Jabuti">Jabuti</option>
                    <option value="Lagarto">Lagarto</option>
                    <option value="Lhama">Lhama</option>
                    <option value="Marreco">Marreco</option>
                    <option value="Ovelha">Ovelha</option>
                    <option value="Papagaio">Papagaio</option>
                    <option value="Pato">Pato</option>
                    <option value="Peixe">Peixe</option>
                    <option value="Periquito">Periquito</option>
                    <option value="Porco">Porco</option>
                    <option value="Porquinho-da-índia">Porquinho-da-índia</option>
                    <option value="Pássaro">Pássaro</option>
                    <option value="Pônei">Pônei</option>
                    <option value="Rato">Rato</option>
                    <option value="Sapo">Sapo</option>
                    <option value="Tartaruga">Tartaruga</option>
                    <option value="Teiú">Teiú</option>
                    <option value="Vaca">Vaca</option>
                    <option value="Outro">Outro</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Raça</label>
                  <input type="text" id="pet-breed" placeholder="Ex: Golden Retriever" class="input-field">
                </div>
                <div class="form-group">
                  <label class="form-label">Sexo</label>
                  <select id="pet-sex" class="input-field" required>
                    <option value="" disabled selected>Selecione o sexo</option>
                    <option value="M">Macho</option>
                    <option value="F">Fêmea</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="form-group">
                  <label class="form-label">Idade</label>
                  <div class="flex items-center gap-2">
                    <input type="number" id="pet-age" placeholder="Ex: 3" class="input-field w-1/2" min="0" required>
                    <select id="pet-age-unit" class="input-field w-1/2" disabled>
                      <option value="anos" selected>Anos</option>
                      <option value="meses">Meses</option>
                      <option value="semanas">Semanas</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Peso (kg)</label>
                  <input type="number" id="pet-weight" placeholder="Ex: 12.5" class="input-field" step="0.1" min="0" required>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                <div class="form-group">
                  <label class="form-label">Filhote</label>
                  <div class="flex items-center gap-4 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                      <input type="radio" name="pet-is-filhote" value="sim" class="sr-only">
                      <div class="w-5 h-5 rounded border border-slate-300 bg-white flex items-center justify-center transition-all group-has-[:checked]:bg-[#006F93] group-has-[:checked]:text-white group-has-[:checked]:border-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-0 group-has-[:checked]:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <span class="text-sm font-medium text-slate-700">Sim</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                      <input type="radio" name="pet-is-filhote" value="nao" class="sr-only" checked>
                      <div class="w-5 h-5 rounded border border-slate-300 bg-white flex items-center justify-center transition-all group-has-[:checked]:bg-[#006F93] group-has-[:checked]:text-white group-has-[:checked]:border-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-0 group-has-[:checked]:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <span class="text-sm font-medium text-slate-700">Não</span>
                    </label>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Castrado</label>
                  <div class="flex items-center gap-4 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                      <input type="radio" name="pet-castrated" value="sim" class="sr-only">
                      <div class="w-5 h-5 rounded border border-slate-300 bg-white flex items-center justify-center transition-all group-has-[:checked]:bg-[#006F93] group-has-[:checked]:text-white group-has-[:checked]:border-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-0 group-has-[:checked]:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <span class="text-sm font-medium text-slate-700">Sim</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                      <input type="radio" name="pet-castrated" value="nao" class="sr-only" checked>
                      <div class="w-5 h-5 rounded border border-slate-300 bg-white flex items-center justify-center transition-all group-has-[:checked]:bg-[#006F93] group-has-[:checked]:text-white group-has-[:checked]:border-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-0 group-has-[:checked]:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <span class="text-sm font-medium text-slate-700">Não</span>
                    </label>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Alergias</label>
                <textarea id="pet-allergies" placeholder="Descreva aqui se o pet possui alguma alergia..." class="input-field h-24"></textarea>
              </div>

              <div class="form-group">
                <label class="form-label">Medicamentos Contínuos</label>
                <textarea id="pet-medications" placeholder="Liste os medicamentos que o pet toma regularmente..." class="input-field h-24"></textarea>
              </div>

              <div class="flex items-center justify-end gap-3 pt-6 border-t border-[var(--color-input-border)]">
                <button type="button" onclick="history.back()" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar Pet</button>
              </div>
            </form>
          </div>
        </div>
    `;

    renderAppLayout({
      title: 'Adicionar Pet',
      content: '<div id="add-pet-content"></div>'
    });

    withLoading('add-pet-content', () => `
      <div class="max-w-2xl mx-auto space-y-8">
        ${SkeletonHeader(false)}
        ${SkeletonForm()}
      </div>
    `, () => {
        const html = renderContent();
        setTimeout(initAdicionarPet, 0);
        return html;
    }, 800);
  </script>
</body>
</html>
